<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التقرير المالي الذكي (Vercel + Gemini AI)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --ai-color: #7c3aed;
            --bg: #f8fafc;
            --border: #e2e8f0;
        }

        body { font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid var(--border); text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .btn { background: var(--primary); color: white; padding: 12px 24px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-ai { background: var(--ai-color); font-size: 16px; margin-top: 15px; width: 100%; }
        
        .nav-tabs { display: flex; gap: 10px; margin-top: 20px; border-bottom: 2px solid var(--border); }
        .tab-btn { padding: 10px 20px; border: none; background: none; font-weight: bold; cursor: pointer; color: #64748b; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        .tab-content.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: right; }
        th { background: #f1f5f9; }
        .total { font-weight: bold; background: #f8fafc; }
        .loader { display: none; margin-top: 15px; color: var(--ai-color); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; color: var(--primary);">استخراج القوائم المالية بالذكاء الاصطناعي</h1>
    
    <div class="card">
        <h3>رفع ميزان المراجعة (Excel)</h3>
        <button class="btn" onclick="document.getElementById('fileInput').click()">اختيار الملف</button>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleFile(event)">
        <div id="fileName" style="margin-top: 10px; font-weight: bold;"></div>

        <button class="btn btn-ai" onclick="processWithVercelAI()">تحليل بالذكاء الاصطناعي وإنشاء التقرير ✨</button>
        <div id="loader" class="loader">جاري تحليل البيانات عبر Vercel & Gemini AI... ⏳</div>
    </div>

    <div class="nav-tabs" id="tabsHeader" style="display: none;">
        <button class="tab-btn active" onclick="switchTab(event, 'incomeTab')">قائمة الدخل</button>
        <button class="tab-btn" onclick="switchTab(event, 'balanceTab')">المركز المالي</button>
        <button class="tab-btn" onclick="switchTab(event, 'cashTab')">التدفقات النقدية</button>
        <button class="tab-btn" onclick="switchTab(event, 'notesTab')">ملاحظات الذكاء الاصطناعي</button>
    </div>

    <div id="incomeTab" class="tab-content">
        <h2>قائمة الدخل</h2>
        <table><thead><tr><th>البيان</th><th>المبلغ</th></tr></thead><tbody id="incomeBody"></tbody></table>
    </div>

    <div id="balanceTab" class="tab-content">
        <h2>المركز المالي</h2>
        <table><thead><tr><th>البيان</th><th>المبلغ</th></tr></thead><tbody id="balanceBody"></tbody></table>
    </div>

    <div id="cashTab" class="tab-content">
        <h2>التدفقات النقدية</h2>
        <table><thead><tr><th>البيان</th><th>المبلغ</th></tr></thead><tbody id="cashBody"></tbody></table>
    </div>

    <div id="notesTab" class="tab-content">
        <h2>الإيضاحات والملاحظات</h2>
        <ul id="notesContent"></ul>
    </div>
</div>

<script>
    let csvData = "";

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileName').textContent = `الملف: ${file.name}`;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            csvData = XLSX.utils.sheet_to_csv(worksheet);
        };
        reader.readAsArrayBuffer(file);
    }

    async function processWithVercelAI() {
        if (!csvData) {
            alert("يرجى اختيار ملف ميزان المراجعة أولاً!");
            return;
        }

        document.getElementById('loader').style.display = 'block';

        try {
            // إرسال البيانات للـ API Route في Vercel
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ csvData: csvData })
            });

            const data = await response.json();
            document.getElementById('loader').style.display = 'none';

            if (!response.ok) {
                alert(data.error || "حدث خطأ أثناء الاتصال بالخادم.");
                return;
            }

            renderReport(data);

        } catch (err) {
            document.getElementById('loader').style.display = 'none';
            alert("تعذر الاتصال بخادم Vercel.");
        }
    }

    function renderReport(data) {
        const fillTable = (id, items) => {
            document.getElementById(id).innerHTML = items.map(i => 
                `<tr class="${i.label.includes('إجمالي') || i.label.includes('صافي') ? 'total' : ''}">
                    <td>${i.label}</td><td>${Number(i.amount).toLocaleString()}</td>
                </tr>`
            ).join('');
        };

        fillTable('incomeBody', data.incomeStatement);
        fillTable('balanceBody', data.balanceSheet);
        fillTable('cashBody', data.cashFlow);

        document.getElementById('notesContent').innerHTML = data.notes.map(n => `<li>${n}</li>`).join('');

        document.getElementById('tabsHeader').style.display = 'flex';
        switchTab(null, 'incomeTab');
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (evt) evt.currentTarget.classList.add('active');
        else document.querySelector('.tab-btn').classList.add('active');
    }
</script>

</body>
</html>
