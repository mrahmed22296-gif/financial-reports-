<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>مولد القوائم المالية — من ميزان المراجعة إلى التقرير الكامل</title>

<style>
  :root{
    --ink:#16241C;
    --ink-soft:#3B4A3F;
    --paper:#EAF0E6;
    --paper-line:#C9D9C3;
    --paper-deep:#DCE7D6;
    --card:#F6F9F3;
    --white:#FFFFFF;
    --brass:#A9782E;
    --brass-dark:#7E5A20;
    --emerald:#2F7A52;
    --emerald-soft:#E4F1E9;
    --signal:#B23A3A;
    --signal-soft:#F7E7E5;
    --shadow: 0 6px 24px rgba(22,36,28,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 34px, var(--paper-line) 35px);
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
  }
  .num{ font-family:'IBM Plex Mono', monospace; direction:ltr; unicode-bidi:isolate; font-variant-numeric: tabular-nums; }
  header.hero{
    background: linear-gradient(180deg, var(--ink) 0%, #1F3226 100%);
    color:var(--paper);
    padding: 46px 24px 34px;
    border-bottom: 6px solid var(--brass);
    position:relative;
  }
  header.hero::after{
    content:"";
    position:absolute; inset:auto 0 0 0; height:6px;
    background: repeating-linear-gradient(90deg, var(--brass) 0 18px, transparent 18px 26px);
    opacity:.5;
  }
  .hero-inner{ max-width:1080px; margin:0 auto; display:flex; gap:32px; align-items:center; flex-wrap:wrap; }
  .hero-text{ flex:1 1 380px; min-width:280px;}

  .eyebrow::before{ content:""; width:22px; height:2px; background:var(--brass); display:inline-block;}
  h1{ font-family:'Cairo',sans-serif; font-weight:900; font-size:clamp(28px,4vw,42px); margin:0 0 12px; line-height:1.25;}
  .hero-sub{ font-size:16px; color:#DCE7D6; line-height:1.9; max-width:56ch;}
  .hero-badges{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap;}
  .badge{ font-family:'Cairo',sans-serif; font-size:12px; font-weight:700; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); padding:6px 12px; border-radius:100px;}

  .scale-card{ background:rgba(255,255,255,0.05); border:1px solid rgba(201,217,195,0.25); border-radius:16px; padding:18px 22px; flex:0 0 300px; text-align:center;}
  .scale-svg{ width:100%; max-width:260px; height:auto; margin-bottom:4px;}
  #beamGroup{ transition: transform .5s cubic-bezier(.2,.9,.3,1.2); transform-origin: 150px 40px; }
  .scale-status{ font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; margin-top:6px;}
  .scale-status.balanced{ color:#7FD9A8;}
  .scale-status.off{ color:#F0A6A0;}
  .scale-figures{ display:flex; justify-content:space-between; font-size:12px; color:#C9D9C3; margin-top:6px;}

  main{ max-width:1080px; margin:0 auto; padding:34px 24px 80px;}
  .card{ background:var(--card); border:1px solid var(--paper-line); border-radius:16px; box-shadow:var(--shadow); padding:24px; margin-bottom:28px;}
  .card h2{ font-family:'Cairo',sans-serif; font-weight:800; font-size:20px; margin:0 0 4px; display:flex; align-items:center; gap:10px;}
  .card h2 .idx{ font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--brass); color:#fff; padding:2px 9px; border-radius:6px;}
  .card .hint{ color:var(--ink-soft); font-size:13.5px; margin:2px 0 18px;}

  .upload-zone{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:var(--paper); border:2px dashed var(--brass); border-radius:14px;
    padding:18px 22px; margin-bottom:18px; transition:.15s;
  }
  .upload-zone.dragover{ background:var(--emerald-soft); border-color:var(--emerald);}
  .upload-icon{ font-size:28px;}
  .upload-text{ flex:1 1 260px; display:flex; flex-direction:column; gap:2px;}
